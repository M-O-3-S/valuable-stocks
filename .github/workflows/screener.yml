name: Run Stock Screener

on:
  schedule:
    - cron: '0 1 * * 0'  # Every Sunday 01:00 UTC = 10:00 KST
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: 'Fiscal year for financial data (e.g. 2025). Leave blank for auto.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run - do not commit results'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run diagnostics (verify DART key + data source connectivity)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python diagnose.py

      - name: Run screener
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.fiscal_year }}" ]; then
            ARGS="--year ${{ github.event.inputs.fiscal_year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python run_screener.py $ARGS

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --staged --quiet || git commit -m "chore: update screener results $(date -u +%Y-%m-%d)"
          git push origin main

      - name: Deploy docs/ to gh-pages branch
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy docs/ content into a temp folder
          cp -r docs /tmp/gh-pages-content

          # Switch to gh-pages branch (create if not exists)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Clean working tree and replace with docs/ content
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/gh-pages-content/. .

          git add -A
          git diff --staged --quiet || git commit -m "deploy: update GitHub Pages $(date -u +%Y-%m-%d)"
          git push origin gh-pages

          # Return to main
          git checkout main
