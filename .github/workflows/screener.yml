name: Run Stock Screener

on:
  schedule:
    - cron: '0 1 * * 0'  # Every Sunday 01:00 UTC = 10:00 KST
  workflow_dispatch:
    inputs:
      fiscal_year:
        description: 'Fiscal year for financial data (e.g. 2025). Leave blank for auto.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run - do not commit results'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify DART API key is set
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "::error::DART_API_KEY secret is not set. Go to Settings → Secrets and variables → Actions → New repository secret, Name: DART_API_KEY"
            exit 1
          fi
          echo "DART_API_KEY is set (length: ${#DART_API_KEY} chars)"

      - name: Run screener
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.fiscal_year }}" ]; then
            ARGS="--year ${{ github.event.inputs.fiscal_year }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python run_screener.py $ARGS

      - name: Commit and push results
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --staged --quiet || git commit -m "chore: update screener results $(date -u +%Y-%m-%d)"
          git push
